B-Debian13-coverage:
  image: debian:13-slim
  stage: build
  before_script:
  - apt-get update -qq
  - env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wget make git autoconf automake libtool bison libpam0g-dev libxmlsec1-dev libxml2-utils help2man gtk-doc-tools valgrind gengetopt
  - env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq faketime lcov libpam-wrapper
  script:
  - echo "--suppressions=$(pwd)/libpskc/tests/libpskc.supp" >> ~/.valgrindrc
  - !reference [.gnulib-fetch, script]
  - ./bootstrap
  - ./configure -C --enable-gcc-warnings --enable-root-tests --enable-valgrind-tests CFLAGS="-g --coverage"
  - make init-coverage
  - make -j$(nproc) V=1 VERBOSE=t build-coverage
  - grep '^PASS tst_usersfile.sh' liboath/tests/tst_usersfile.log
  - grep '^PASS run-root-tests.sh' pam_oath/tests/run-root-tests.sh.log
  - lcov --remove doc/coverage/oath-toolkit.info '/usr/include/*' '*/liboath/gl/*' '*/liboath/tests/*' '*/libpskc/gl/*' '*/libpskc/tests/*' '*/pam_oath/tests/*' -o doc/coverage/oath-toolkit-filtered.info
  - make gen-coverage PACKAGE=oath-toolkit-filtered
  - !reference [.save-artifacts, script]
  - mv doc/coverage/ out/$CI_JOB_NAME_SLUG/

B-Fedora39-clanganalyzer:
  image: fedora:39
  stage: build
  before_script:
  - dnf update -y
  - dnf install -y wget make patch git autoconf automake libtool bison pam-devel xmlsec1-openssl-devel libtool-ltdl-devel libxml2-devel help2man gtk-doc valgrind gengetopt
  - dnf install -y datefudge clang clang-analyzer
  script:
  - !reference [.gnulib-fetch, script]
  - ./bootstrap
  - scan-build ./configure -C --with-xmlsec-crypto-engine=openssl
  - scan-build -o clang-analyzer make -j$(nproc) V=1
  - !reference [.save-artifacts, script]
  - mv clang-analyzer/ out/$CI_JOB_NAME_SLUG/

# https://clang.llvm.org/docs/AddressSanitizer.html
# https://github.com/google/sanitizers/wiki/AddressSanitizer
# https://github.com/google/sanitizers/wiki/AddressSanitizerFlags
# https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html
# https://clang.llvm.org/docs/LeakSanitizer.html
# https://github.com/google/sanitizers/wiki/AddressSanitizerLeakSanitizer
# https://lists.gnu.org/archive/html/bug-gnulib/2022-03/msg00016.html
B-F41-clang-Sanitizer:
  image: fedora:41
  stage: build
  before_script:
  - time dnf -y update
  - time dnf install -y wget make patch git autoconf automake libtool bison pam-devel libxml2-devel help2man valgrind gengetopt
  - time dnf install -y clang
  script:
  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time env ASAN_OPTIONS=detect_leaks=0 ./configure -C --enable-gcc-warnings CC=clang CFLAGS="-g -O0 -fsanitize=undefined -fsanitize=address -fno-sanitize-recover=all -fsanitize-address-use-after-scope -D_FORTIFY_SOURCE=0"
  - time env ASAN_OPTIONS=detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1 make check VERBOSE=t V=1
  - grep '^PASS tst_oathtool' oathtool/tests/tst_oathtool.sh.log
  - grep '^PASS tst_validate' libpskc/tests/tst_validate.log
  - make clean; rm config.cache
  - time env ASAN_OPTIONS=detect_leaks=0 ./configure -C --enable-gcc-warnings CC=clang CFLAGS="-g -O1 -fsanitize=undefined -fsanitize=address -fno-sanitize-recover=all -fsanitize-address-use-after-scope"
  - time env ASAN_OPTIONS=detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1 make check VERBOSE=t V=1
  - grep '^PASS tst_oathtool' oathtool/tests/tst_oathtool.sh.log
  - grep '^PASS tst_validate' libpskc/tests/tst_validate.log
  - make clean; rm config.cache
  - time env ASAN_OPTIONS=detect_leaks=0 ./configure -C --enable-gcc-warnings CC=clang CFLAGS="-g -O2 -fsanitize=undefined -fsanitize=address -fno-sanitize-recover=all -fsanitize-address-use-after-scope"
  - time env ASAN_OPTIONS=detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1 make check VERBOSE=t V=1
  - grep '^PASS tst_oathtool' oathtool/tests/tst_oathtool.sh.log
  - grep '^PASS tst_validate' libpskc/tests/tst_validate.log

Fedora-rawhide:
  image: fedora:rawhide
  stage: test
  needs: [B-Guix]
  before_script:
  - dnf install -y make gcc diffutils file pam-devel
  - dnf install -y libxml2-devel xmlsec1-devel xmlsec1-openssl libtool-ltdl-devel
  script:
  - tar xfa out/b-guix/oath-toolkit-*.tar.gz
  - cd $(tar tfa out/b-guix/oath-toolkit-*.tar.gz | head -n1)
  - ./configure -C --enable-gcc-warnings --with-xmlsec-crypto-engine=no
  - make -j$(nproc) check V=1 VERBOSE=t
  - grep '^SKIP tst_sign.sh' pskctool/tests/tst_sign.sh.log

