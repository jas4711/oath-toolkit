Website:
  image: kpengboy/trisquel:11.0
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
  - sed -i 's,http://archive.trisquel.info/trisquel,http://ftp.acc.umu.se/mirror/trisquel/packages,' /etc/apt/sources.list
  - time apt-get update -q
  - time apt-get install -y -q eatmydata
  - time eatmydata apt-get install -y -q --no-install-recommends wget ca-certificates make git autoconf automake libtool bison libpam0g-dev libxmlsec1-dev libxml2-utils help2man gtk-doc-tools gengetopt datefudge patch
  - time eatmydata env DEBIAN_FRONTEND=noninteractive apt-get install -y -q asciidoc groff xsltproc
