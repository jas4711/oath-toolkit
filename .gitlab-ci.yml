  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time ./configure -C --enable-gcc-warnings CC="clang -std=gnu2x -gdwarf-4 -fsanitize=address,undefined -fno-sanitize-recover=all -fsanitize-address-use-after-scope" WARN_CFLAGS=-Werror --with-xmlsec-crypto-engine=no
  - time make -k syntax-check
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_totp_validate' liboath/tests/tst_totp_validate.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log
  - time make clean; rm config.cache
  - time ./configure -C --enable-gcc-warnings CC="clang -std=c23 -D_POSIX_C_SOURCE=200112L -gdwarf-4 -fsanitize=address,undefined -fno-sanitize-recover=all -fsanitize-address-use-after-scope" WARN_CFLAGS=-Werror --with-xmlsec-crypto-engine=no
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_totp_validate' liboath/tests/tst_totp_validate.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log
  - time make clean; rm config.cache
  - time eatmydata apt-get install -y -q --no-install-recommends datefudge
  - time ./configure -C --enable-gcc-warnings CC="clang -gdwarf-4" WARN_CFLAGS=-Werror
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_usersfile.sh' liboath/tests/tst_usersfile.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log

B-AlmaLinux8:
  image: almalinux:8
  stage: build
  before_script:
  - |
    dnf -y install wget make git autoconf automake libtool bison diffutils patch
    dnf -y install pam-devel valgrind
    dnf -y --enablerepo=powertools install gtk-doc help2man
    dnf -y install libxml2-devel libtool-ltdl-devel
    dnf -y install --enablerepo=powertools xmlsec1-openssl-devel
    dnf -y install epel-release
    dnf -y --enablerepo=epel install faketime gengetopt
    dnf -y install --enablerepo=baseos-debuginfo libxml2-debuginfo
  script:
  - echo "--suppressions=$(pwd)/libpskc/tests/libpskc.supp" >> ~/.valgrindrc
  - !reference [.gnulib-fetch, script]
  - ./bootstrap
  - ./configure -C --enable-gtk-doc --enable-gcc-warnings --enable-root-tests --enable-valgrind-tests
  - make -j$(nproc) syntax-check
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 check VERBOSE=t
  - grep '^PASS tst_sign.sh' pskctool/tests/tst_sign.sh.log
  - make -j$(nproc) dist
  - !reference [.save-artifacts, script]

