  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time ./configure --enable-gcc-warnings -C --enable-gtk-doc --enable-gtk-doc-pdf
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 check VERBOSE=t
  - grep '^PASS tst_usersfile.sh' liboath/tests/tst_usersfile.log
  - make -j$(nproc) dist
  - cd website; ./build-website.sh; cd ..
  - !reference [.save-artifacts, script]
  - mv -v website/html out/$CI_JOB_NAME_SLUG/

