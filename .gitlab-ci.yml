# https://docs.gitlab.com/ci/runners/hosted_runners/windows/
B-Windows-UCRT64:
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - when: manual
  tags: [ saas-windows-medium-amd64 ]
  stage: build
  script: # https://www.msys2.org/docs/ci/#other-systems
  - wget.exe -nv --no-check-certificate -O msys2.exe https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-base-x86_64-latest.sfx.exe
  - Get-FileHash ./msys2.exe -Algorithm SHA256 | Format-List
  - ./msys2.exe -y -oC:\
  - Remove-Item msys2.exe
  - $env:CHERE_INVOKING = 'yes'
  - $env:MSYSTEM = 'UCRT64' # https://www.msys2.org/docs/environments/
  - C:\msys64\usr\bin\bash -lc ' '
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - |
    C:\msys64\usr\bin\bash -lcx '
    pacman --noconfirm -Syu git autoconf automake libtool patch make mingw-w64-ucrt-x86_64-gcc bison gtk-doc gengetopt help2man
    # https://docs.github.com/en/get-started/getting-started-with-git/configuring-git-to-handle-line-endings
    git status
    git describe
    file configure.ac
    git config --global core.autocrlf false
    git config --global core.eol lf
    git rm -rf --cached . | tail
    git reset --hard HEAD
    git status
    git describe
    file configure.ac
    GNULIB_REVISION=$(grep GNULIB_REVISION=[0-9a-f] .gitlab-ci.yml | sed s,.*GNULIB_REVISION=,,)
    wget -nv https://gitlab.com/libidn/gnulib-mirror/-/archive/$GNULIB_REVISION/gnulib-mirror-$GNULIB_REVISION.tar.gz
    tar xfa gnulib-mirror-$GNULIB_REVISION.tar.gz
    rm -fv gnulib-mirror-$GNULIB_REVISION.tar.gz
    export GNULIB_SRCDIR=gnulib-mirror-$GNULIB_REVISION
    export PATH=$PWD/gnulib-mirror-$GNULIB_REVISION:$PATH
    ./bootstrap
    ./configure -C --enable-gcc-warnings
    make -j$(nproc) V=1 -k check VERBOSE=t'
  - C:\msys64\usr\bin\bash -lc 'grep ^PASS liboath/tests/tst_totp_validate.log'

