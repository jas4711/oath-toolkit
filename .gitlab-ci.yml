  before_script:
  - cat /etc/os-release
  - time apt-get update -q
  - time apt-get install -y -q eatmydata
  - time eatmydata apt-get install -y -q --no-install-recommends wget ca-certificates make git autoconf automake libtool bison libpam0g-dev libxmlsec1-dev libxml2-utils help2man gtk-doc-tools gengetopt datefudge patch valgrind
  script:
  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time ./configure -C --enable-gcc-warnings --enable-valgrind-tests
