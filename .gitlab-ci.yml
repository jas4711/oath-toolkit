variables:
  GIT_DEPTH: 250

stages:
 - build
 - repro
 - test

default:
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
    - ./**/config.h
    - ./**/*.log
    - ./out/$CI_JOB_NAME_SLUG/**

.gnulib-fetch:
  script:
  - GNULIB_REVISION=2a288c048e2a23ea9cd8cbef9a60aa4ac82bdc3d
  - wget -nv https://gitlab.com/libidn/gnulib-mirror/-/archive/$GNULIB_REVISION/gnulib-mirror-$GNULIB_REVISION.tar.gz
  - gzip -cd gnulib-mirror-$GNULIB_REVISION.tar.gz | tar xf -
  - rm -fv gnulib-mirror-$GNULIB_REVISION.tar.gz
  - export GNULIB_SRCDIR=$PWD/gnulib-mirror-$GNULIB_REVISION
  - export PATH=$PWD/gnulib-mirror-$GNULIB_REVISION:$PATH

.save-artifacts:
  script:
  - (! command -v git > /dev/null) || git -C $CI_PROJECT_DIR status
  - (! command -v git > /dev/null) || git -C $CI_PROJECT_DIR diff --exit-code # nothing should change version controlled files
  - sha256sum *.tar.* || true
  - mkdir -pv $CI_PROJECT_DIR/out/$CI_JOB_NAME_SLUG/{src,log}
  - find . -name out -prune -o -name '*.log' -print -o -name 'config.h' -print | xargs --no-run-if-empty mv --backup=numbered -v -t $CI_PROJECT_DIR/out/$CI_JOB_NAME_SLUG/log || true
  - mv -v *-src.tar.* $CI_PROJECT_DIR/out/$CI_JOB_NAME_SLUG/src/ || true
  - mv -v *.tar.* $CI_PROJECT_DIR/out/$CI_JOB_NAME_SLUG/ || true

sast:
  stage: build
  variables:
    SAST_EXCLUDED_PATHS: liboath/gl, libpskc/gl
include:
- template: Security/SAST.gitlab-ci.yml

B-Guix:
  rules:
  - when: always # used by merge request jobs with 'needs' on this job
  image: registry.gitlab.com/debdistutils/guix/container:extra
  stage: build
  before_script:
  - cp -rL /gnu/store/*profile/etc/* /etc/
  - . /etc/profile
  - echo 'root:x:0:0:root:/:/bin/sh' > /etc/passwd
  - echo 'root:x:0:' > /etc/group
  - groupadd --system guixbuild
  - for i in $(seq -w 1 10); do useradd -g guixbuild -G guixbuild -d /var/empty -s $(command -v nologin) -c "Guix build user $i" --system guixbuilder$i; done
  - env LANG=C.UTF-8 guix-daemon --build-users-group=guixbuild &
  - guix archive --authorize < /share/guix/ci.guix.gnu.org.pub
  - guix archive --authorize < /share/guix/bordeaux.guix.gnu.org.pub
  - guix describe
  - guix install --verbosity=0 linux-pam
  - GUIX_PROFILE="//.guix-profile"
  - . "$GUIX_PROFILE/etc/profile"
  - . /etc/profile
  script:
  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time ./configure --enable-gcc-warnings CPPFLAGS="$(pkg-config --cflags pam)" LDFLAGS="$(pkg-config --libs pam)"
  - time make -j$(nproc) syntax-check
  - time make -j$(nproc) check V=1 VERBOSE=t
  - time make V=1 dist
  - !reference [.save-artifacts, script]

B-gcc:
  tags: [ saas-linux-medium-amd64 ]
  image: gcc:latest
  stage: build
  before_script:
  - gcc --version
  - cat /etc/os-release
  - time apt-get update -q
  - time apt-get install -y -q eatmydata
  - time eatmydata apt-get install -y -q --no-install-recommends wget ca-certificates make git autoconf automake libtool bison pkgconf libpam0g-dev libxml2-dev libxmlsec1-dev libxml2-utils help2man gengetopt patch valgrind
  script:
  - !reference [.gnulib-fetch, script]
  - time ./bootstrap
  - time ./configure -C --enable-gcc-warnings CC="gcc -std=gnu2x -fsanitize=address,undefined -fno-sanitize-recover=all -fsanitize-address-use-after-scope" WARN_CFLAGS=-Werror --with-xmlsec-crypto-engine=no
  - time make -k syntax-check
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_totp_validate' liboath/tests/tst_totp_validate.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log
  - time make clean; rm config.cache
  - time ./configure -C --enable-gcc-warnings CC="gcc -std=c23 -D_POSIX_C_SOURCE=200112L -fsanitize=address,undefined -fno-sanitize-recover=all -fsanitize-address-use-after-scope" WARN_CFLAGS=-Werror --with-xmlsec-crypto-engine=no
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_totp_validate' liboath/tests/tst_totp_validate.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log
  - time make clean; rm config.cache
  - time eatmydata apt-get install -y -q --no-install-recommends datefudge
  - time ./configure -C --enable-gcc-warnings WARN_CFLAGS=-Werror
  - time make V=1 VERBOSE=t -j$(nproc) -k check
  - grep '^PASS tst_usersfile.sh' liboath/tests/tst_usersfile.log
  - grep '^PASS tst_pskctool' pskctool/tests/tst_pskctool.sh.log

